[package]
name = "browser-driver"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
filesystem-tool = { path = "../filesystem-tool" }
chromiumoxide = { version = "0.9.1", default-features = false }
# Scripted WebSocket responses for the hermetic CDP harness in
# `test_utils` (same spec as the desktop bridge). The harness ships so
# downstream integration tests can drive scripted CDP traffic; production
# paths never construct it.
async-tungstenite = { version = "0.32", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
tokio.workspace = true
thiserror.workspace = true
url.workspace = true
session-sync = { path = "../session-sync" }
serde.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true
zeroize.workspace = true

[lints]
workspace = true
